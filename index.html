<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>SimulasiTKD Pro — Platform Simulasi &amp; Tryout CAT TKD</title>
  <meta name="description" content="Platform web simulasi &amp; tryout CAT TKD (TWK, TIU, TKP) berstandar BKN dengan timer real-time, analisis passing grade, pembahasan lengkap, dan peringkat nasional." />

  <!-- Fonts: Plus Jakarta Sans + Inter (Sesuai Stitch DESIGN.md) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            emeraldDeep: '#0E3B2C',
            emeraldDark: '#002419',
            emeraldAccent: '#1F8A5B',
            emeraldBright: '#22A06B',
            sageBg: '#F7FAF8',
            mintTint: '#E8F5EE'
          },
          fontFamily: {
            heading: ['"Plus Jakarta Sans"', 'sans-serif'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons & Chart.js -->
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <!-- Custom Design System CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-[#F7FAF8] text-[#111827] antialiased selection:bg-[#E8F5EE] selection:text-[#0E3B2C]">

  <!-- Toast Container -->
  <div id="toast-container" class="no-print"></div>

  <!-- Modal Container -->
  <div id="modal-root" class="no-print"></div>

  <!-- Main SPA App Root -->
  <div id="app" class="min-h-screen flex flex-col">
    <div class="max-w-6xl mx-auto w-full px-4 py-12 space-y-6">
      <div class="skeleton h-14 w-full"></div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="skeleton h-44"></div>
        <div class="skeleton h-44"></div>
        <div class="skeleton h-44"></div>
      </div>
    </div>
  </div>

  <!-- Modular Scripts (Pure Static Frontend — No .gs files!) -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
