<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>SimulasiTKD Pro — Simulasi Ujian CAT Standar BKN</title>
  <meta name="description" content="Platform simulasi dan evaluasi ujian CAT TKD (TWK, TIU, TKP) berstandar BKN untuk seleksi CPNS, BUMN, dan Sekolah Kedinasan." />

  <!-- Tailwind CSS CDN (Swiss Anchor: 1 Sans Family, #FFFFFF / #F7F7F8 Surface, International Orange #FF4F00) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            swissWhite: '#FFFFFF',
            swissNeutral: '#F7F7F8',
            swissInk: '#111111',
            swissMuted: '#52525B',
            swissSubtle: '#71717A',
            swissRule: '#DCDCE0',
            swissAccent: '#FF4F00'
          },
          fontFamily: {
            sans: ['"Helvetica Neue"', '"Akzidenz-Grotesk"', '"Söhne"', 'Helvetica', 'Arial', 'sans-serif'],
            heading: ['"Helvetica Neue"', '"Akzidenz-Grotesk"', '"Söhne"', 'Helvetica', 'Arial', 'sans-serif'],
            mono: ['"Helvetica Neue"', '"Akzidenz-Grotesk"', '"Söhne"', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons, Chart.js & Google Identity Services (OAuth 2.0) -->
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Swiss Design System CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-[#FFFFFF] text-[#111111] antialiased selection:bg-[#FF4F00] selection:text-[#FFFFFF]">

  <!-- Toast Container -->
  <div id="toast-container" class="no-print"></div>

  <!-- Modal Container -->
  <div id="modal-root" class="no-print"></div>

  <!-- Main SPA App Root -->
  <div id="app" class="min-h-screen flex flex-col">
    <div class="max-w-7xl mx-auto w-full px-6 py-12 border-x border-[#DCDCE0]">
      <div class="skeleton h-12 w-full mb-6"></div>
      <div class="grid grid-cols-1 md:grid-cols-3 border-t border-l border-[#DCDCE0]">
        <div class="skeleton h-40 border-r border-b border-[#DCDCE0]"></div>
        <div class="skeleton h-40 border-r border-b border-[#DCDCE0]"></div>
        <div class="skeleton h-40 border-r border-b border-[#DCDCE0]"></div>
      </div>
    </div>
  </div>

  <!-- Modular Scripts (Pure Static Frontend) -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
